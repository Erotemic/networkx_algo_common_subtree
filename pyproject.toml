[build-system]
requires = [
  "scikit-build-core>=0.10",
  "cython>=0.29.24",
  "cmake>=3.21",
  "ninja>=1.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "networkx_algo_common_subtree"
version = "0.2.3"
description = "A networkx implementation of algorithms to find common ordered subtree minors and isomorphisms"
readme = "README.rst"
requires-python = ">=3.8"
license = { text = "Apache 2" }
authors = [
  { name = "Jon Crall", email = "erotemic@gmail.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "networkx>=2.7",
]

[project.optional-dependencies]
runtime = ["networkx>=2.7"]
tests = [
  "xdoctest>=1.1.3",
  "pytest>=7.4.4",
  "pytest-cov>=3.0.0",
  "coverage[toml]>=6.5.0",
  "ubelt>=1.3.4",
]
build = [
  "scikit-build-core>=0.10",
  "ninja>=1.10.2",
  "cmake>=3.21.2",
  "cython>=0.29.24",
]

[project.urls]
Homepage = "https://github.com/Erotemic/networkx_algo_common_subtree"

[tool.scikit-build]
cmake.version = ">=3.21"
wheel.packages = ["networkx_algo_common_subtree"]

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
build-frontend = "build"
build-verbosity = 1
test-command = "python -c \"import importlib, os; disabled=os.getenv('DISABLE_RUST_EXTENSIONS', '').lower() in {'1', 'true', 'on', 'yes'}; print('rust disabled=', disabled); importlib.import_module('networkx_algo_common_subtree._rust') if not disabled else None\" && python {project}/run_tests.py"
test-extras = ["tests", "runtime"]

[tool.mypy]
ignore_missing_imports = true

[tool.xcookie]
tags = [ "github", "erotemic", "binpy",]
mod_name = "networkx_algo_common_subtree"
repo_name = "networkx_algo_common_subtree"
rel_mod_parent_dpath = "."
os = [ "all", "win", "osx", "linux",]
url = 'https://github.com/Erotemic/networkx_algo_common_subtree'
min_python = '3.8'
author = "Jon Crall"
author_email = "erotemic@gmail.com"
description = "A networkx implementation of algorithms to find common ordered subtree minors and isomorphisms"
license = "Apache 2"
dev_status = "alpha"
xdoctest_style="freeform"

[tool.pytest.ini_options]
addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py --ignore-glob=dev --ignore-glob=docs"
norecursedirs = [".git", "ignore", "build", "__pycache__", "dev", "_skbuild", "Documents and Settings", "System Volume Information", "$Recycle.Bin"]
filterwarnings = [ "default", "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning", "ignore:.*Define the __nice__ method for.*:Warning", "ignore:.*private pytest class or function.*:Warning",]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", ".*  # pragma: no cover", ".*  # nocover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if 0:", "if trace is not None", "verbose = .*", "^ *raise", "^ *pass *$", "if _debug:", "if __name__ == .__main__.:", ".*if six.PY2:",]
omit = [ "networkx_algo_common_subtree/__main__.py", "*/setup.py",]

[tool.codespell]
skip = ['./docs/build', './*.egg-info', './build', './htmlcov']
count = true
quiet-level = 3
ignore-words-list = ['wont', 'cant', 'ANS', 'doesnt', 'arent', 'ans', 'thats', 'datas', 'isnt', 'wile']

[tool.cibuildwheel.linux]
before-all = "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable"
environment = { PATH = "/root/.cargo/bin:$PATH", CMAKE_ARGS = "-DREQUIRE_RUST_EXTENSIONS=ON" }

[tool.cibuildwheel.macos]
environment = { CMAKE_ARGS = "-DREQUIRE_RUST_EXTENSIONS=ON" }

[tool.cibuildwheel.windows]
environment = { CMAKE_ARGS = "-DREQUIRE_RUST_EXTENSIONS=ON" }
