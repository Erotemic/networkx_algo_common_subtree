name: Mathematical and Rust verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Install pinned Lean toolchain
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore mathematical dependencies
        working-directory: proofs
        run: lake exe cache get
      - name: Regenerate real Rust semantics
        run: dev/regenerate_rust_lean.sh --check
      - name: Compile all maintained mathematical and refinement modules
        working-directory: proofs
        run: |
          lake build
          lake env lean Tests/RootedDynamicProgram.lean
          lake env lean Tests/OrderedIsomorphism.lean
          lake env lean Tests/LookupEvents.lean
          lake env lean Tests/LookupSource.lean
          lake env lean Tests/LookupSourceFrontend.lean
          lake env lean Tests/LookupHeap.lean
          lake env lean Tests/LookupFrame.lean
          lake env lean Tests/LookupSourceTypes.lean
          lake env lean Tests/Memo.lean
          lake env lean Tests/EditDistance.lean
          lake env lean Tests/MemoWork.lean
          lake env lean experiments/resource_cost_audit/LookupSourceWP.lean
          python3 checks/test_lookup_source_reifier.py
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Test graph algorithms and exhaustive witness oracles
        run: cargo test --locked --manifest-path rust/crates/common_subtree_algorithms/Cargo.toml
      - name: Test ordered extraction core
        run: cargo test --locked --manifest-path rust/crates/verified_ordered_core/Cargo.toml
      - name: Test exact assignment extraction core
        run: cargo test --locked --manifest-path rust/crates/verified_assignment_core/Cargo.toml
  independent-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.13'
      - name: Install oracle dependencies
        run: python -m pip install -r requirements/tests.txt -r requirements/runtime.txt
      - name: Independent tree and sequence enumeration
        run: |
          python proofs/checks/check_printed_containment.py
          python proofs/checks/check_tree_contraction_oracle.py
          python proofs/checks/check_paper_dp_recurrence.py
      - name: Independent graph witnesses and paper scoring
        run: python -m pytest tests/test_common_subtree_reference.py tests/test_common_subtree_reference_properties.py tests/test_common_subtree_correctness_fixtures.py
  python-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.13'
      - name: Build and install the Python extension and verified core
        run: python -m pip install '.[tests]' --config-settings=cmake.define.BUILD_CYTHON_EXTENSIONS=ON --config-settings=cmake.define.REQUIRE_RUST_EXTENSIONS=ON
      - name: Exercise the installed wheel outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c 'from networkx_algo_common_subtree import _rust; assert all(hasattr(_rust, name) for name in ["maximum_common_token_embedding", "maximum_common_token_isomorphism", "maximum_common_subtree_isomorphism", "largest_weight_common_subtree_embedding_with_distance_penalty", "min_cost_assignment", "max_weight_partial_matching", "max_weight_partial_matching_deletions"])'
          COMMON_SUBTREE_REQUIRE_PARITY_BACKENDS=1 python -m pytest "${{ github.workspace }}/tests"
  abi3-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: '3.13'
      - name: Build and audit a portable Rust-only stable-ABI wheel
        run: |
          python -m pip install cibuildwheel==4.3.5 abi3audit
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m cibuildwheel --platform linux --config-file dev/abi3-cibuildwheel.toml --output-dir dist
          abi3audit --strict --summary dist/*.whl
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('dist').glob('*-cp310-abi3-manylinux_2_28_x86_64.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              libraries = [p for p in archive.namelist() if p.endswith(('.so', '.pyd', '.dll', '.dylib'))]
              assert libraries == ['networkx_algo_common_subtree/_rust.abi3.so'], libraries
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cp310-abi3-manylinux-x86_64
          path: dist/*.whl
  abi3-runtime:
    needs: abi3-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: cp310-abi3-manylinux-x86_64
          path: dist
      - name: Install the identical wheel on every runtime
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[tests]"
      - name: Require all Rust families and exercise the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.util
          from networkx_algo_common_subtree import _rust
          assert _rust.__file__.endswith('.abi3.so')
          assert all(hasattr(_rust, name) for name in ['longest_common_balanced_embedding', 'longest_common_balanced_isomorphism', 'maximum_common_token_embedding', 'maximum_common_token_isomorphism', 'maximum_common_subtree_isomorphism', 'largest_weight_common_subtree_embedding_with_distance_penalty', 'min_cost_assignment', 'max_weight_partial_matching', 'max_weight_partial_matching_deletions'])
          for name in ['balanced_embedding_cython', 'balanced_isomorphism_cython']:
              assert importlib.util.find_spec('networkx_algo_common_subtree.' + name) is None
          PY
          python -m pytest -rs "${{ github.workspace }}/tests"
