name: SourceChecks

on:
  push:
    # Restricting push triggers to the default branch avoids running
    # validation twice (push + pull_request events) for every push to a PR
    # branch. Feature branches are covered by pull_request; release refs are
    # handled by release.yml.
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_release_tooling:
    name: Release tooling and workflow lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.13
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.13'
    - name: Release tooling and workflow lint
      shell: bash
      run: |-
        python -m pip install flake8
        flake8 dev/check_release.py dev/check_distributions.py --select=E9,F63,F7,F82 --show-source
        docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -shellcheck= .github/workflows/tests.yml .github/workflows/checks.yml .github/workflows/release.yml
