name: BinPyRelease

on:
  # MAINTAINER INTENT: pushes to the default branch intentionally enter
  # this release workflow. With deployment enabled, test_deploy publishes
  # those artifacts to TestPyPI so every mainline merge exercises the
  # release packaging/signing/trusted-publishing path before promotion.
  # Do not make TestPyPI manual-only or remove the default-branch trigger
  # unless intentionally changing that release policy.
  push:
    branches: [ main, release ]
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional non-production publish target
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - testpypi

jobs:
  build_sdist:
    ##
    # Build the sdist artifact used by the release workflow.
    # This workflow intentionally builds artifacts but does not run the
    # full test matrix.
    ##
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Set up Python 3.13
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.13'
    - name: Build sdist
      shell: bash
      run: |-
        python -m pip install pip -U
        python -m pip install "setuptools>=77" wheel build twine
        python -m build --sdist --outdir wheelhouse
        python -m twine check ./wheelhouse/networkx_algo_common_subtree*.tar.gz
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - uses: actions/upload-artifact@v6.0.0
      name: Upload sdist artifact
      with:
        name: sdist_wheels
        path: ./wheelhouse/networkx_algo_common_subtree*.tar.gz
  build_binpy_wheels:
    ##
    # Build binary wheels used by the release workflow.
    ##
    name: ${{ matrix.os }}, arch=${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Release wheel coverage is deliberately broader than the ordinary test-wheel
        # matrix. Every configured desktop OS must emit the modern native architectures
        # we publish: Linux x86_64 and ARM64, macOS Apple Silicon and Intel, and Windows
        # x86_64. Linux cibuildwheel selectors may emit both manylinux and musllinux
        # artifacts from each native runner. Keep every entry required: TestPyPI/PyPI
        # deploy jobs depend on this entire build job so a missing architecture fails
        # closed instead of publishing a partial wheel set.

        # Normally, xcookie generates explicit lists of platforms to build / test
        # on, but in this case cibuildwheel does that for us, so we need to just
        # set the environment variables for cibuildwheel. These are parsed out of
        # the standard [tool.cibuildwheel] section in pyproject.toml and set
        # explicitly here.
        include:
        - os: ubuntu-latest
          arch: auto
          cibw_skip: '*-win32'
        - os: ubuntu-24.04-arm
          arch: auto
          cibw_skip: '*-win32'
        - os: macos-15
          arch: auto
          cibw_skip: '*-win32'
        - os: macos-15-intel
          arch: auto
          cibw_skip: '*-win32'
        - os: windows-latest
          arch: auto
          cibw_skip: '*-win32'
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - name: Enable MSVC 64bit
      uses: ilammy/msvc-dev-cmd@v1.13.0
      if: startsWith(matrix.os, 'windows-')
      with:
        arch: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
    - name: Build binary wheels
      uses: pypa/cibuildwheel@v4.3.1
      with:
        output-dir: wheelhouse
        config-file: pyproject.toml
      env:
        CIBW_SKIP: ${{ matrix.cibw_skip }}
        CIBW_TEST_SKIP: '*-win_arm64'
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        PYTHONUTF8: '1'
        VSCMD_ARG_TGT_ARCH: ''
        CIBW_ARCHS_WINDOWS: auto64
        CIBW_ARCHS_MACOS: auto64
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - name: Set up Python 3.13 for wheel validation
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.13'
    - name: Validate built wheel artifacts
      shell: bash
      run: bash dev/ci_wheel_post_build.sh
    - uses: actions/upload-artifact@v6.0.0
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/networkx_algo_common_subtree*.whl
  test_deploy:
    name: Deploy Test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi')
    needs:
    - build_binpy_wheels
    - build_sdist
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - uses: actions/download-artifact@v7.0.0
      name: Download wheels
      with:
        pattern: wheels-*
        merge-multiple: true
        path: wheelhouse
    - uses: actions/download-artifact@v7.0.0
      name: Download sdist
      with:
        name: sdist_wheels
        path: wheelhouse
    - name: Show files to upload
      shell: bash
      run: ls -la wheelhouse
    - name: Sign and Publish
      env:
        TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TEST_TWINE_PASSWORD }}
        CI_SECRET: ${{ secrets.CI_SECRET }}
      run: |-
        GPG_EXECUTABLE=gpg
        $GPG_EXECUTABLE --version
        openssl version
        $GPG_EXECUTABLE --list-keys
        echo "Decrypting Keys"
        openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_public_gpg_key.pgp.enc | $GPG_EXECUTABLE --import
        openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/gpg_owner_trust.enc | $GPG_EXECUTABLE --import-ownertrust
        openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_secret_gpg_subkeys.pgp.enc | $GPG_EXECUTABLE --import
        echo "Finish Decrypt Keys"
        $GPG_EXECUTABLE --list-keys || true
        $GPG_EXECUTABLE --list-keys  || echo "first invocation of gpg creates directories and returns 1"
        $GPG_EXECUTABLE --list-keys
        VERSION=$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path('"'"'networkx_algo_common_subtree/__init__.py'"'"').read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, "id", None) == "__version__" for t in n.targets)))')
        python -m pip install pip -U
        python -m pip install packaging twine -U
        python -m pip install urllib3 requests[security]
        GPG_KEYID=$(cat dev/public_gpg_key)
        echo "GPG_KEYID = '$GPG_KEYID'"
        GPG_SIGN_CMD="$GPG_EXECUTABLE --batch --yes --detach-sign --armor --local-user $GPG_KEYID"
        WHEEL_PATHS=(wheelhouse/*.whl wheelhouse/*.tar.gz)
        WHEEL_PATHS_STR=$(printf '"%s" ' "${WHEEL_PATHS[@]}")
        echo "$WHEEL_PATHS_STR"
        for WHEEL_PATH in "${WHEEL_PATHS[@]}"
        do
            echo "------"
            echo "WHEEL_PATH = $WHEEL_PATH"
            $GPG_SIGN_CMD --output $WHEEL_PATH.asc $WHEEL_PATH
            $GPG_EXECUTABLE --verify $WHEEL_PATH.asc $WHEEL_PATH  || echo "hack, the first run of gpg very fails"
            $GPG_EXECUTABLE --verify $WHEEL_PATH.asc $WHEEL_PATH
        done
        ls -la wheelhouse
        python -m pip install opentimestamps-client
        ots stamp wheelhouse/*.whl wheelhouse/*.tar.gz wheelhouse/*.asc
        ls -la wheelhouse
        twine upload --username __token__ --password "$TWINE_PASSWORD" --repository-url "$TWINE_REPOSITORY_URL" wheelhouse/*.whl wheelhouse/*.tar.gz --skip-existing --verbose || { echo "failed to twine upload" ; exit 1; }
    - uses: actions/upload-artifact@v6.0.0
      name: Upload deploy artifacts
      with:
        name: deploy_artifacts
        path: |-
          wheelhouse/*.whl
          wheelhouse/*.zip
          wheelhouse/*.tar.gz
          wheelhouse/*.asc
          wheelhouse/*.ots
  live_deploy:
    name: Deploy Live
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs:
    - build_binpy_wheels
    - build_sdist
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - uses: actions/download-artifact@v7.0.0
      name: Download wheels
      with:
        pattern: wheels-*
        merge-multiple: true
        path: wheelhouse
    - uses: actions/download-artifact@v7.0.0
      name: Download sdist
      with:
        name: sdist_wheels
        path: wheelhouse
    - name: Show files to upload
      shell: bash
      run: ls -la wheelhouse
    - name: Sign and Publish
      env:
        TWINE_REPOSITORY_URL: https://upload.pypi.org/legacy/
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        CI_SECRET: ${{ secrets.CI_SECRET }}
      run: |-
        GPG_EXECUTABLE=gpg
        $GPG_EXECUTABLE --version
        openssl version
        $GPG_EXECUTABLE --list-keys
        echo "Decrypting Keys"
        openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_public_gpg_key.pgp.enc | $GPG_EXECUTABLE --import
        openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/gpg_owner_trust.enc | $GPG_EXECUTABLE --import-ownertrust
        openssl enc -aes-256-cbc -pbkdf2 -md SHA512 -pass env:CI_SECRET -d -a -in dev/ci_secret_gpg_subkeys.pgp.enc | $GPG_EXECUTABLE --import
        echo "Finish Decrypt Keys"
        $GPG_EXECUTABLE --list-keys || true
        $GPG_EXECUTABLE --list-keys  || echo "first invocation of gpg creates directories and returns 1"
        $GPG_EXECUTABLE --list-keys
        VERSION=$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path('"'"'networkx_algo_common_subtree/__init__.py'"'"').read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, "id", None) == "__version__" for t in n.targets)))')
        python -m pip install pip -U
        python -m pip install packaging twine -U
        python -m pip install urllib3 requests[security]
        GPG_KEYID=$(cat dev/public_gpg_key)
        echo "GPG_KEYID = '$GPG_KEYID'"
        GPG_SIGN_CMD="$GPG_EXECUTABLE --batch --yes --detach-sign --armor --local-user $GPG_KEYID"
        WHEEL_PATHS=(wheelhouse/*.whl wheelhouse/*.tar.gz)
        WHEEL_PATHS_STR=$(printf '"%s" ' "${WHEEL_PATHS[@]}")
        echo "$WHEEL_PATHS_STR"
        for WHEEL_PATH in "${WHEEL_PATHS[@]}"
        do
            echo "------"
            echo "WHEEL_PATH = $WHEEL_PATH"
            $GPG_SIGN_CMD --output $WHEEL_PATH.asc $WHEEL_PATH
            $GPG_EXECUTABLE --verify $WHEEL_PATH.asc $WHEEL_PATH  || echo "hack, the first run of gpg very fails"
            $GPG_EXECUTABLE --verify $WHEEL_PATH.asc $WHEEL_PATH
        done
        ls -la wheelhouse
        python -m pip install opentimestamps-client
        ots stamp wheelhouse/*.whl wheelhouse/*.tar.gz wheelhouse/*.asc
        ls -la wheelhouse
        twine upload --username __token__ --password "$TWINE_PASSWORD" --repository-url "$TWINE_REPOSITORY_URL" wheelhouse/*.whl wheelhouse/*.tar.gz --skip-existing --verbose || { echo "failed to twine upload" ; exit 1; }
    - uses: actions/upload-artifact@v6.0.0
      name: Upload deploy artifacts
      with:
        name: deploy_artifacts
        path: |-
          wheelhouse/*.whl
          wheelhouse/*.zip
          wheelhouse/*.tar.gz
          wheelhouse/*.asc
          wheelhouse/*.ots
  release:
    name: Create Github Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
    - live_deploy
    steps:
    - name: Checkout source
      uses: actions/checkout@v6.0.2
    - uses: actions/download-artifact@v7.0.0
      name: Download artifacts
      with:
        name: deploy_artifacts
        path: wheelhouse
    - name: Show files to release
      shell: bash
      run: ls -la wheelhouse
    - run: 'echo "Automatic Release Notes. TODO: improve" > ${{ github.workspace }}-CHANGELOG.txt'
    - name: Resolve Release Tag
      id: release_meta
      shell: bash
      run: |-
        export VERSION=$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path('"'"'networkx_algo_common_subtree/__init__.py'"'"').read_text()); print(next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(getattr(t, "id", None) == "__version__" for t in n.targets)))')
        echo "VERSION=$VERSION"
        test -n "$VERSION" || { echo "failed to parse version" ; exit 1; }
        TAG="v$VERSION"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
    - name: Tag Release Commit
      shell: bash
      run: |-
        TAG="${{ steps.release_meta.outputs.tag }}"
        REMOTE_SHA=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
        if [[ -n "$REMOTE_SHA" ]]; then
            test "$REMOTE_SHA" = "$GITHUB_SHA" || {
                echo "$TAG already points to $REMOTE_SHA, not $GITHUB_SHA"
                exit 1
            }
            echo "$TAG already points to this release commit"
        else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
        fi
    - uses: softprops/action-gh-release@v2.5.0
      name: Create Release
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        body_path: ${{ github.workspace }}-CHANGELOG.txt
        tag_name: ${{ steps.release_meta.outputs.tag }}
        name: Release ${{ steps.release_meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        body: Automatic Release
        generate_release_notes: true
        draft: false
        prerelease: false
        files: |-
          wheelhouse/*.whl
          wheelhouse/*.asc
          wheelhouse/*.ots
          wheelhouse/*.zip
          wheelhouse/*.tar.gz


