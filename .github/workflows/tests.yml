name: Package CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install flake8
      - run: flake8 networkx_algo_common_subtree dev/check_release.py dev/check_distributions.py --select=E9,F63,F7,F82 --show-source
      - name: Validate release workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 .github/workflows/tests.yml .github/workflows/publish.yml

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: python -m pip install build twine
      - name: Build and validate source archive
        run: |
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*.tar.gz
      - name: Rebuild wheel from source archive
        run: python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir sdist-wheel -Cbuild-dir=${{ runner.temp }}/sdist-build -Ccmake.define.REQUIRE_RUST_EXTENSIONS=ON
      - name: Install rebuilt wheel and test dependencies
        run: |
          python -m pip install sdist-wheel/*.whl
          python -m pip install -r requirements/tests.txt
      - name: Require installed APIs and compiled parity
        working-directory: ${{ runner.temp }}
        run: |
          python "${{ github.workspace }}/dev/check_release.py" --require-rust --require-cython
          COMMON_SUBTREE_REQUIRE_PARITY_BACKENDS=1 python -m pytest -q "${{ github.workspace }}/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: python -m pip install cibuildwheel==4.3.5
      - name: Build wheels and test installed endpoints
        run: python -m cibuildwheel --output-dir dist
        env:
          CIBW_SKIP: '*-win32'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  abi3-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cibuildwheel==4.3.5 abi3audit
      - name: Build portable Rust-only stable-ABI wheel
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m cibuildwheel --platform linux --config-file dev/abi3-cibuildwheel.toml --output-dir dist
          abi3audit --strict --summary dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-abi3-linux
          path: dist/*.whl
          if-no-files-found: error

  abi3-runtime:
    needs: abi3-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-abi3-linux
          path: dist
      - name: Install same artifact and test dependencies
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[tests]"
          if [[ '${{ matrix.python }}' == '3.10' ]]; then
            python -m pip install networkx==2.8.8
          fi
      - name: Exercise installed Rust-only distribution
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python "${{ github.workspace }}/dev/check_release.py" --require-rust
          python -m pytest -q "${{ github.workspace }}/tests"

  release-ready:
    needs: [lint, sdist, wheels, abi3-runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: python -m pip install packaging twine
      - name: Validate distribution versions, README and hashes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python dev/check_distributions.py dist --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
