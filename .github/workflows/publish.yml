name: Publish tested release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Package CI run containing release-dist
        required: true
      tag:
        description: Existing release tag, for example v0.3.0
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check successful same-repository build and matching tag
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.RUN_ID)) throw new Error('Invalid run ID');
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a final version tag');
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: Number(process.env.RUN_ID)});
            if (run.path !== '.github/workflows/tests.yml' || run.conclusion !== 'success' ||
                run.head_repository.full_name !== `${repo.owner}/${repo.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event)) {
              throw new Error('Use a successful same-repository Package CI push/manual run');
            }
            const {data: commit} = await github.rest.repos.getCommit({...repo, ref: tag});
            if (commit.sha !== run.head_sha) throw new Error('Tag and tested artifacts refer to different commits');
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install packaging twine
      - name: Revalidate tested artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python dev/check_distributions.py dist --tag "$RELEASE_TAG" --verify-manifest
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: python -m twine upload --non-interactive dist/*.whl dist/*.tar.gz
